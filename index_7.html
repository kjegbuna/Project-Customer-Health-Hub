<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Health Hub — Demo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjM2Y1YmZmIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMWIyNTU5Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTUiIGZpbGw9InVybCgjZykiLz48cGF0aCBkPSJNMTIgMzUgaDkgbDQgLTEyIGw3IDIyIGw0IC0xMyBoMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZmZmZiIgc3Ryb2tlLXdpZHRoPSI0LjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg==">
<style>
  :root{
    /* brand palette */
    --brand:#3248fe;         /* primary */
    --brand-d:#091439;        /* deep navy */
    --brand-lt:#eef0ff;       /* light tint */
    --navy:#091439;
    --accent:#ffa61f;         /* accent */
    --accent-lt:#fff4e2;
    /* neutrals */
    --ink:#141a20; --muted:#5f6b76; --line:#e6e8f0; --bg:#f4f5f7; --card:#ffffff; --surface:#ffffff;
    /* header/crumb text now sits on light grey — repurposed to dark-on-light values */
    --on-navy:#141a20; --on-navy-dim:#5f6b76; --link-navy:#3248fe;
    /* health signals (kept: green / yellow / red) */
    --ok:#0f9d6b; --ok-bg:#e6f7ef; --watch:#d69412; --watch-bg:#fdf3df; --risk:#d1453b; --risk-bg:#fce9e7;
    --shadow:0 1px 2px rgba(9,20,57,.06),0 1px 3px rgba(9,20,57,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:radial-gradient(1200px 600px at 70% -10%, #3248fe0f, transparent), var(--bg)}
  .login-card{background:var(--card);width:400px;max-width:92vw;border-radius:16px;box-shadow:var(--shadow);
              padding:34px 32px;border:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brandlogo{height:26px;width:auto;display:block}
  .brandfb{align-items:center;gap:10px}
  .logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--navy));
               display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .logo b{font-size:16px;letter-spacing:.2px}
  .login-card h1{font-size:20px;margin:2px 0 4px}
  .login-card p.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px}
  .team{display:flex;gap:10px;margin-bottom:18px}
  .member{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px 8px;text-align:center;background:#fff;
           transition:.15s;display:flex;flex-direction:column;align-items:center;gap:7px}
  .member:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
  .member.sel{border-color:var(--brand);background:var(--brand-lt)}
  .avatar{width:40px;height:40px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;
          justify-content:center;font-size:15px}
  .member small{font-size:12px;font-weight:600}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
  .btn{width:100%;padding:11px;border:none;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;
       font-size:14px}
  .btn:hover{background:var(--brand-d)}
  .login-foot{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center}
  .linkbtn{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;font-size:inherit;padding:0;text-decoration:underline}

  /* ---------- APP CHROME ---------- */
  #app{min-height:100vh}
  .topbar{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding:0 26px;height:60px;display:flex;
          align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  .topbar .logo b{font-size:15px;color:var(--navy)}
  .topbar .logo .mark{background:linear-gradient(135deg,var(--brand),var(--navy))}
  .topbar-tag{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:11px;margin-left:4px;font-weight:600}
  @media(max-width:600px){.topbar-tag{display:none}}
  .topbar .right{display:flex;align-items:center;gap:14px}
  .who-pill{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--on-navy-dim)}
  .link{background:none;border:none;color:var(--link-navy);font-weight:600;font-size:13px}
  .wrap{max-width:1120px;margin:0 auto;padding:26px}

  .crumb{font-size:13px;color:var(--on-navy-dim);margin-bottom:14px}
  .crumb button{background:none;border:none;color:var(--link-navy);font-weight:600;padding:0}
  .crumb .sep{margin:0 8px;color:var(--line)}

  h2.page{font-size:22px;margin:0 0 3px;color:var(--ink)}
  .page-sub{color:var(--on-navy-dim);font-size:13.5px;margin:0 0 20px}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--brand)}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px}
  .kpi.risk .n{color:var(--risk)} .kpi.watch .n{color:var(--watch)} .kpi.ok .n{color:var(--ok)}

  /* toolbar */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:#fff}
  .filters{display:flex;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--muted);font-weight:600}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* customer table */
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
     padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
  td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr.row:hover{background:var(--brand-lt);cursor:pointer}
  tr.row:last-child td{border-bottom:none}
  .co{display:flex;align-items:center;gap:11px}
  .colar{width:32px;height:32px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;
         justify-content:center;font-size:13px;flex-shrink:0;position:relative;overflow:hidden}
  .colar img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px;border-radius:inherit;opacity:0;transition:opacity .18s ease}
  .co b{font-size:14px} .co small{display:block;color:var(--muted);font-size:11.5px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
  .p-ok{background:var(--ok-bg);color:var(--ok)} .p-watch{background:var(--watch-bg);color:var(--watch)}
  .p-risk{background:var(--risk-bg);color:var(--risk)}
  .p-off{background:#eef1f4;color:#5f6b76}
  tr.row.inactive{opacity:.72} tr.row.inactive:hover{opacity:1}
  .dots{display:flex;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dot.g{background:var(--ok)} .dot.y{background:var(--watch)} .dot.r{background:var(--risk)}
  .mini{font-size:12px;color:var(--muted)}
  .amt{font-variant-numeric:tabular-nums;font-weight:600}

  /* ---------- DETAIL ---------- */
  .detail-head{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);
               display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
  .detail-head .l{display:flex;gap:15px;align-items:center}
  .detail-head .colar{width:48px;height:48px;font-size:18px;border-radius:11px}
  .detail-head h2{margin:0;font-size:22px}
  .detail-head .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .detail-head .r{text-align:right}
  .detail-head .r .why{font-size:12px;color:var(--muted);max-width:260px;margin-top:8px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);
         display:flex;flex-direction:column;min-height:320px}
  .panel .drill{margin-top:auto}
  .panel.span{grid-column:1/-1}
  .panel h3{margin:0 0 3px;font-size:15px;display:flex;align-items:center;gap:9px}
  .panel .wt{font-size:10.5px;font-weight:700;color:var(--brand);background:var(--brand-lt);border-radius:5px;padding:2px 6px;text-transform:uppercase;letter-spacing:.4px}
  .panel .cap{font-size:12px;color:var(--muted);margin:0 0 14px}
  .stat-row{display:flex;flex-wrap:wrap;gap:20px}
  .stat-row.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 18px}
  .stat{min-width:96px}
  .stat .v{font-size:20px;font-weight:800;letter-spacing:-.4px}
  .stat .k{font-size:11.5px;color:var(--muted);margin-top:2px}
  .flag{margin-top:13px;font-size:12.5px;padding:9px 11px;border-radius:8px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
  .flag.r{background:var(--risk-bg);color:#a5342c} .flag.y{background:var(--watch-bg);color:#8a5a10}
  .flag.g{background:var(--ok-bg);color:#0a744e}
  .flag b{font-weight:700}
  .drill{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .drill-btn{background:none;border:none;color:var(--brand);font-weight:700;font-size:13px;padding:0;display:inline-flex;align-items:center;gap:6px}
  .drill-btn:hover{text-decoration:underline}
  .banner{background:linear-gradient(90deg,var(--accent-lt),#fff);border:1px solid #f4d9b0;border-radius:11px;padding:13px 16px;
          font-size:13px;margin-bottom:18px;display:flex;gap:10px;align-items:center;color:#8a5a10}
  .footnote{color:var(--on-navy-dim);font-size:11.5px;text-align:center;margin:26px 0 8px}

  /* ---------- SUB-VIEW (record lists) ---------- */
  .sub-head{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:16px;
            display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .sub-head h2{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
  .sub-head .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .sub-summary{display:flex;gap:22px;flex-wrap:wrap}
  .sub-summary .stat .v{font-size:18px}

  .reclist{display:flex;flex-direction:column;gap:10px}
  .rec{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .rec-top{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .rec-top:hover{background:var(--brand-lt)}
  .rec-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
          font-size:15px;font-weight:700;background:var(--brand-lt);color:var(--brand)}
  .rec-main{flex:1;min-width:0}
  .rec-main b{font-size:14px;display:block;line-height:1.3}
  .rec-main .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rec-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .rec-right .when{font-size:12px;color:var(--muted)}
  .chev{transition:transform .18s;color:var(--muted);flex-shrink:0}
  .rec.open .chev{transform:rotate(90deg)}
  .rec-body{display:none;padding:0 16px 16px 62px;border-top:1px solid var(--line);margin-top:0}
  .rec.open .rec-body{display:block;padding-top:14px}
  .tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .t-open{background:var(--watch-bg);color:var(--watch)} .t-resolved{background:var(--ok-bg);color:var(--ok)}
  .t-overdue{background:var(--risk-bg);color:var(--risk)} .t-paid{background:var(--ok-bg);color:var(--ok)}
  .t-high{background:var(--risk-bg);color:var(--risk)} .t-med{background:var(--watch-bg);color:var(--watch)}
  .t-low{background:var(--brand-lt);color:var(--brand)} .t-neutral{background:#eef1f4;color:var(--muted)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin:4px 0 14px}
  .kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .kv .v{font-size:13.5px;font-weight:600;margin-top:2px}
  .rec-body p.desc{font-size:13px;line-height:1.55;color:#2c333b;margin:0 0 14px}
  .thread{border-left:2px solid var(--brand-lt);padding-left:14px;display:flex;flex-direction:column;gap:12px}
  .thread .ev{position:relative}
  .thread .ev:before{content:"";position:absolute;left:-19px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .thread .ev .h{font-size:12px;color:var(--muted);margin-bottom:2px}
  .thread .ev .h b{color:var(--ink)}
  .thread .ev .txt{font-size:13px;line-height:1.5}
  .subtle{color:var(--muted)}
  .metaline{font-size:12px;color:var(--muted);margin:2px 0 16px}
  /* sort controls */
  .sortbar{display:flex;align-items:center;gap:9px;margin:0 0 12px}
  .sortbar label{font-size:12px;color:var(--on-navy-dim);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .sortsel{padding:7px 30px 7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;
           color:var(--ink);font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;
           background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
           background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .sortsel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
  /* per-person interaction timeline (stakeholder ⇄ interactions link) */
  .ixlist{border-left:2px solid var(--brand-lt);padding-left:13px;display:flex;flex-direction:column;gap:9px;margin:2px 0 4px}
  .ixitem{font-size:12.7px;line-height:1.4}
  .ixitem .ic{font-weight:700}
  .ixitem .d{color:var(--muted);font-size:11.5px;margin-top:1px}
  /* click-out source link (Unthread / Linear) */
  .srclink{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand);text-decoration:none;white-space:nowrap;
           border:1px solid var(--brand-lt);background:var(--brand-lt);border-radius:7px;padding:4px 9px;cursor:pointer;font-family:inherit}
  .srclink:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .srclink.off{background:#eef1f4;border-color:var(--line);color:var(--muted);cursor:default}
  .srclink.off:hover{background:#eef1f4;color:var(--muted);border-color:var(--line)}
  /* source pop-over */
  .srcmodal{position:fixed;inset:0;background:rgba(9,20,57,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .srcmodal .card{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:22px;box-shadow:0 24px 70px rgba(9,20,57,.45)}
  .srcmodal h4{margin:0 0 6px;font-size:16px}
  .srcmodal p{font-size:12.7px;color:var(--muted);line-height:1.5;margin:0 0 13px}
  .srcmodal .u{font-size:12px;color:var(--ink);word-break:break-all;background:#eef1f6;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .mbtns{display:flex;gap:9px;justify-content:flex-end}
  .mbtn{padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
  .mbtn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mbtn.primary:hover{background:var(--brand-d)}
  /* sortable table headers */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--brand)}
  th .arw{font-size:9px;margin-left:3px;color:var(--brand)}
  th .arw.dim{color:var(--line)}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}
     .detail-head{flex-direction:column}.detail-head .r{text-align:left}.hide-sm{display:none}
     .rec-body{padding-left:16px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="logo"><span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 9 2-6h5"/></svg></span><b>Customer Health Hub</b></div>
    <div id="signinForm">
      <h1>Sign in</h1>
      <p class="sub">Demo build &mdash; sign in with any email to explore the app.</p>
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" value="demo@example.com"></div>
      <div class="field"><label>Password</label><input id="pw" type="password" placeholder="Any password" value="demo"></div>
      <div id="siErr" class="login-foot" style="color:var(--risk);display:none"></div>
      <button class="btn" onclick="login()">Enter demo &rarr;</button>
    </div>
    <div class="login-foot" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">Sample data &middot; runs entirely in your browser &middot; nothing is stored or sent</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo"><span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 9 2-6h5"/></svg></span><b>Customer Health Hub</b><span class="topbar-tag">Demo</span></div>
    <div class="right">
      <div class="who-pill"><span class="avatar" id="meAv" style="width:28px;height:28px;font-size:12px"></span><span id="meName"></span></div>
      <button class="link" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="wrap" id="view"></div>
  <div class="footnote">Sample data · demo build · runs entirely in your browser</div>
</div>

<script>
/* Self-contained demo build — no backend. All data is fictional sample data built in
   the browser; there are no API keys, no database, and no network calls. */

const HL={ok:["p-ok","Healthy"],watch:["p-watch","Watch"],risk:["p-risk","At risk"]};
const money=n=>"$"+Number(n||0).toLocaleString();
const initials=s=>(s||"?").split(/[\s-]/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const MS=86400000, TODAY=new Date();
const daysAgo=ds=>{ if(!ds) return null; const d=new Date(ds); if(isNaN(d)) return null; return Math.max(0,Math.round((TODAY-d)/MS)); };
const dAgo=n=>{ const d=new Date(TODAY); d.setDate(d.getDate()-(n||0)); return d; };
const fmtD=d=>{ if(d==null) return "—"; const x=(d instanceof Date)?d:new Date(d); if(isNaN(x)) return "—"; return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };

/* ---------- health / why (derived from live signals) ---------- */
function calcHealth(r){
  const acv=r.acv||0, ar=r.ar||0, ov=r.overdue||0, opn=r.sup.open||0, sev=r.sup.sev, recur=r.sup.recur, since=r.intx.since, renew=r.renew;
  let risk=false, watch=false;
  if(ov>0) risk=true; else if(acv>0 && ar>acv) risk=true; else if(ar>0) watch=true;
  if(sev==="high" && recur) risk=true; else if(sev==="high") watch=true; else if(sev==="med" && (recur||opn>=3)) watch=true; else if(opn>=4) watch=true;
  if(since!=null){ if(since>180) risk=true; else if(since>60) watch=true; }
  if(renew!=null && renew>=0 && renew<=14 && (ar>0||opn>0)) risk=true; else if(renew!=null && renew>=0 && renew<=45) watch=true;
  return risk?"risk":(watch?"watch":"ok");
}
function calcWhy(r){
  const acv=r.acv||0, ar=r.ar||0, ov=r.overdue||0, opn=r.sup.open||0, sev=r.sup.sev, recur=r.sup.recur, since=r.intx.since, renew=r.renew;
  if(ov>0) return `${money(ar)} invoice ${ov} days overdue — clear it before the renewal conversation.`;
  if(acv>0 && ar>acv) return `${money(ar)} open AR, above the ${money(acv)} contract value — confirm billing is on track.`;
  if(sev==="high" && recur) return `${opn} open issues incl. a recurring high-severity theme — support is the drag.`;
  if(since!=null && since>180) return `No contact in ${since} days — the relationship has gone cold.`;
  if(renew!=null && renew>=0 && renew<=45) return `Renews in ${renew} days — worth a proactive check-in.`;
  if(sev==="high"||sev==="med") return `${opn} open support issue${opn!==1?'s':''} (${sev}) to keep an eye on.`;
  if(ar>0) return `${money(ar)} open receivable, within terms.`;
  if(since!=null && since>60) return `Last touch ${since} days ago — engagement is cooling.`;
  return "Healthy — paid up, active, and no open issues.";
}

// ---- Health score (0-10, one decimal). Weighting model:
// relationships/stakeholders highest, then usage, then support, then finance (least).
// If an area has no data it is excluded and its weight redistributes across the rest.
const SCORE_WEIGHTS={stakeholders:0.35,usage:0.30,support:0.25,finance:0.10};
function clamp100(n){return Math.max(0,Math.min(100,Math.round(n)));}
function scoreStakeholders(r){
  let s=100;
  if(r.stk.gap) s-=5;                          // no Company Admin known (least weight: we rarely deal with execs directly)
  if((r.stk.eng||0)===0) s-=25;                // nobody engaged in 90d
  const d=r.intx.since;
  if(d==null) s-=20; else if(d>365) s-=55; else if(d>180) s-=45; else if(d>90) s-=25; else if(d>30) s-=10;
  if((r.stk.contacts||0)<3) s-=10;
  return clamp100(s);
}
function scoreSupport(r){
  let s=100; const sev=r.sup.sev, open=r.sup.open||0, recur=r.sup.recur;
  if(sev==="high") s-= recur?35:20; else if(sev==="med") s-= recur?15:8;
  if(open>=6) s-=20; else if(open>=3) s-=8;
  return clamp100(s);
}
function scoreFinance(r){
  let s=100;
  if(r.overdue>0) s-=45; else if(r.acv>0 && r.ar>r.acv) s-=25; else if(r.ar>0) s-=8;
  if(r.nocontract) s-=10;
  return clamp100(s);
}
function scoreUsage(r){
  if((r.usage.ev||0)===0 && (r.usage.comms||0)===0 && r.usage.growth==null) return null; // no data yet
  let s=60; s+=Math.min(30,(r.usage.ev||0)*2); if(r.usage.growth!=null) s+=Math.max(-15,Math.min(15,r.usage.growth));
  return clamp100(s);
}
function calcScore(r){
  const parts=[[scoreStakeholders(r),SCORE_WEIGHTS.stakeholders],[scoreUsage(r),SCORE_WEIGHTS.usage],[scoreSupport(r),SCORE_WEIGHTS.support],[scoreFinance(r),SCORE_WEIGHTS.finance]];
  let sum=0,wt=0; parts.forEach(([v,w])=>{ if(v!=null){ sum+=v*w; wt+=w; } });
  return wt?Math.round(sum/wt)/10:null;
}
function healthFromScore(sc){ return sc==null?"watch":(sc>=7.8?"ok":(sc>=5.2?"watch":"risk")); }

const FIRST=["Alex","Priya","Jordan","Maya","Chris","Dana","Sam","Nia","Leo","Ruth","Omar","Ivy","Marcus","Elena","Theo","Grace"];
const LAST=["Reyes","Patel","Kim","Osei","Nguyen","Brooks","Alvarez","Cole","Haddad","Stone","Ford","Bauer","Mensah","Klein","Ito","Diaz"];
const T_ADMIN=["Chief People Officer","VP of People","Head of DEI","Director of Culture"];
const T_TEAM=["ERG Program Lead","People Ops Manager","Talent Partner","Engagement Manager"];
const T_MEMBER=["ERG Co-Chair","Community Lead","People Analyst","Program Coordinator"];
const T_IT=["IT Administrator","Systems Analyst"];
const TICKETS=["Report export times out on large groups","SSO login redirect loop","Event invite not syncing to calendar","Member roster import mismatch","Dashboard slow to load","Budget field not saving","Duplicate notification emails","Permissions not applying to new admin"];
const IX_CALL=["Monthly sync","Quarterly business review","Onboarding call","Renewal check-in","Roadmap review","Kickoff call"];
const IX_EMAIL=["Re: rollout plan","Q3 planning","Invoice question","Feature request follow-up","Intro to a new stakeholder","Event recap"];
const CATS=["performance","feature","access","data","other"];
const SRC_KEYS=["unthread","linear","slack","email"];
const SRC_DISP={unthread:"Unthread",linear:"Linear",slack:"Slack",email:"Email"};
function rng(seed){let s=(seed>>>0)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function pick(a,r){return a[Math.floor(r()*a.length)];}
async function loadDetails(c){
  if(c._d) return c._d;
  const r=rng(c.id.split("").reduce((a,ch)=>a+ch.charCodeAt(0),0));
  // contacts
  const n=Math.max(1,c.stk.contacts), contacts=[];
  for(let i=0;i<n;i++){
    const name=pick(FIRST,r)+" "+pick(LAST,r);
    let role,title;
    if(i===0&&c.stk.admins>0){role="Company Admin";title=pick(T_ADMIN,r);}
    else if(i<=1){role="Team Admin";title=pick(T_TEAM,r);}
    else if(i===n-1&&n>3){role="IT";title=pick(T_IT,r);}
    else{role="Member";title=pick(T_MEMBER,r);}
    const relStatus=i<c.stk.eng?"Engaged":(i<c.stk.eng+2?"Connected":"Identified");
    contacts.push({contact_id:"ct"+i,name,role,title,
      email:name.toLowerCase().replace(/[^a-z]+/g,".")+"@"+c.id,
      relStatus,lastIx:null,last:999999,interactions:[]});
  }
  // interactions
  const inter=[], totalIx=Math.min(c.intx.total,10);
  for(let i=0;i<totalIx;i++){
    const isCall=r()<0.5;
    const when=(c.intx.since==null?60:c.intx.since)+i*Math.max(3,Math.round(14*r()));
    const p1=contacts[Math.floor(r()*contacts.length)]||contacts[0];
    const participants=p1?[{name:p1.name,title:p1.title}]:[{name:"—",title:""}];
    const rec={id:"ix"+i,type:isCall?"Call":"Email",when,date:fmtD(dAgo(when)),participants,
      contact:participants[0].name,role:participants[0].title,
      owner:isCall?"Fathom":"Email",dir:isCall?"—":"Email",
      subj:isCall?pick(IX_CALL,r):pick(IX_EMAIL,r),
      notes:isCall?"Call — transcript on file.":"Logged email thread."};
    if(p1)p1.interactions.push(rec); inter.push(rec);
  }
  contacts.forEach(p=>{ if(p.interactions.length){ p.lastIx=Math.min.apply(null,p.interactions.map(x=>x.when)); p.last=p.lastIx; } });
  // support tickets
  const tickets=[];
  const mk=(idx,open)=>{
    const sev=open?((idx===0&&c.sup.sev)?c.sup.sev:pick(["low","med","med","low"],r)):pick(["low","med"],r);
    const openedAgo=open?((c.sup.since==null?10:c.sup.since)+idx*4):(40+idx*15);
    const updatedAgo=Math.max(0,openedAgo-Math.round((open?3:6)*r()));
    const requester=(contacts[Math.floor(r()*contacts.length)]||contacts[0]||{}).name||"—";
    const subject=pick(TICKETS,r), src=pick(SRC_KEYS,r);
    const thread=[{whenAgo:openedAgo,who:requester,txt:subject}];
    if(!open) thread.push({whenAgo:updatedAgo,who:"Support",txt:"Marked resolved."});
    return {id:"ev"+(open?"o":"r")+idx,subject,category:pick(CATS,r),severity:sev,
      status:open?"Open":"Resolved",kind:pick(["Ticket","Bug","Ticket"],r),source:SRC_DISP[src],
      sourceUrl:null,opened:fmtD(dAgo(openedAgo)),openedAgo,updated:fmtD(dAgo(updatedAgo)),
      updatedAgo,requester,assignee:"—",recurring:open&&c.sup.recur&&idx<2,thread};
  };
  for(let i=0;i<c.sup.open;i++) tickets.push(mk(i,true));
  const resN=1+Math.round(2*r()); for(let i=0;i<resN;i++) tickets.push(mk(i,false));
  const theme=c.sup.recur?"performance":"None";
  // invoices
  const inv=[];
  if(!c.nocontract){
    const amt=Math.max(1000,Math.round((c.acv/4)/100)*100);
    inv.push({number:"INV-1042",amount:amt,status:"Paid",daysOverdue:0,dueAgo:120,issued:fmtD(dAgo(150)),due:fmtD(dAgo(120)),period:"Subscription",paidDate:fmtD(dAgo(118))});
    inv.push({number:"INV-1088",amount:amt,status:"Paid",daysOverdue:0,dueAgo:30,issued:fmtD(dAgo(60)),due:fmtD(dAgo(30)),period:"Subscription",paidDate:fmtD(dAgo(28))});
    if(c.overdue>0) inv.push({number:"INV-1103",amount:c.ar||amt,status:"Overdue",daysOverdue:c.overdue,dueAgo:c.overdue,issued:fmtD(dAgo(c.overdue+30)),due:fmtD(dAgo(c.overdue)),period:"Subscription",paidDate:null});
    else if(c.ar>0) inv.push({number:"INV-1103",amount:c.ar,status:"Open",daysOverdue:0,dueAgo:-10,issued:fmtD(dAgo(5)),due:fmtD(dAgo(-10)),period:"Subscription",paidDate:null});
  }
  // usage activity
  const acts=[], ACT=[["Event","Created an event"],["Comm","Sent an announcement"],["Members","Added members"],["Admin","Updated budget"],["Members","Reached a goal"]];
  const actN=(c.usage.ev||0)?6:(c.nocontract?0:2);
  for(let i=0;i<actN;i++){ const a=ACT[i%ACT.length], when=1+i*3; acts.push({type:a[0],when,title:a[1],detail:fmtD(dAgo(when))}); }
  acts.sort((a,b)=>a.when-b.when);
  return c._d={contacts,tickets,inter,inv,acts,theme};
}

function renderRenew(c){

}
function setFilter(f){filter=f;renderPortfolio();}
let psortKey="health", psortDir=1;
function pcmp(a,b){
  const hv={risk:0,watch:1,ok:2}; let r=0;
  switch(psortKey){
    case "name": r=a.name.localeCompare(b.name); break;
    case "health": r=hv[a.health]-hv[b.health]; break;
    case "score": r=(b.score||0)-(a.score||0); break;
    case "ar": r=b.ar-a.ar; break;
    case "renew": r=(a.renew==null?1e9:a.renew)-(b.renew==null?1e9:b.renew); break;
    case "stk": r=(a.stk.gap?0:1)-(b.stk.gap?0:1)||a.name.localeCompare(b.name); break;
  }
  return r*psortDir || a.name.localeCompare(b.name);
}
function parw(k){return psortKey===k?`<span class="arw">${psortDir>0?'▲':'▼'}</span>`:'<span class="arw dim">↕</span>';}
function setPSort(k){ if(psortKey===k){psortDir*=-1;} else {psortKey=k; psortDir=1;} renderPortfolio(); }

  const scoreCol=c.nocontract?'#9aa3b2':barColor(c.health);
  const flag=(cls,txt)=>`<div class="flag ${cls}">${txt}</div>`;
  const finFlag = c.overdue>0?flag("r",`<span><b>${money(c.ar)}</b> outstanding, ${c.overdue} days overdue.</span>`)
                 : c.ar>c.acv&&c.acv>0?flag("y",`<span><b>${money(c.ar)}</b> open AR — above annual contract value.</span>`)
                 : c.ar>0?flag("y",`<span><b>${money(c.ar)}</b> open, within terms.</span>`)
                 : flag("g","<span>Paid up — no open receivables.</span>");
  const supFlag = c.sup.sev==="high"?flag("r",`<span><b>${c.sup.open} open</b> incl. a high-severity issue${c.sup.recur?" · recurring theme":""}.</span>`)
                 : c.sup.open>0?flag("y",`<span><b>${c.sup.open} open</b> (${c.sup.sev})${c.sup.recur?" · recurring theme":""}.</span>`)
                 : flag("g","<span>No open support issues.</span>");
  const useFlag = c.usage.ev>=10?flag("g","<span>Active — admins using the product regularly.</span>")
                 : c.usage.ev>=5?flag("y","<span>Moderate activity — worth a nudge.</span>")
                 : c.usage.ev>0?flag("r","<span>Low product usage — the strongest early churn signal.</span>")
                 : flag("y","<span>No product usage recorded in the last 30 days.</span>");
  const intxFlag= c.intx.since==null?flag("y","<span>No interactions logged yet.</span>")
                 : c.intx.since>10?flag("y",`<span>Last touch ${c.intx.since} days ago — cooling.</span>`)
                 : flag("g",`<span>Recent contact (${c.intx.since}d ago), ${c.intx.d90} touches in 90 days.</span>`);
  const stkFlag = c.stk.gap?flag("y","<span><b>Coverage gap:</b> no Company Admin (CPO/CDO/CEO) identified. Multi-thread via a Team Admin.</span>")
                 : flag("g","<span>Company Admin on file.</span>");
  const drill=(sec,label)=>`<div class="drill"><button class="drill-btn" onclick="event.stopPropagation();openSub('${id}','${sec}')">${label} →</button></div>`;
  document.getElementById("view").innerHTML=`
    <div class="crumb"><button onclick="renderPortfolio()">← Portfolio</button> <span class="sep">/</span> ${c.name}</div>
    <div class="detail-head">
      <div class="l">${coLogo(c)}
        <div><h2>${c.name}</h2><div class="meta">${c.id} · ${c.nocontract?"no contract on file":money(c.acv)+" ACV · renews in "+c.renew+" days ("+c.rstat+")"}</div></div></div>
      <div class="r"><span class="pill ${pc}">${pl}</span> <span style="font-size:22px;font-weight:800;color:${scoreCol};margin-left:6px">${scoreDisp}</span><div class="mini" style="text-align:right">health score / 10</div><div class="why">${c.why}</div></div>
    </div>
    <div class="grid">
      <div class="panel">
        <h3>Product Usage <span class="wt">weight: 2nd</span></h3>
        <p class="cap">Are the admins actually using the product? <em>(last 30 days)</em></p>
        <div class="stat-row">
          <div class="stat"><div class="v">${c.usage.ev}</div><div class="k">Events · 30d</div></div>
          <div class="stat"><div class="v">${c.usage.comms}</div><div class="k">Comms · 30d</div></div>
          <div class="stat"><div class="v">${c.usage.growth==null?'—':(c.usage.growth>0?'+':'')+c.usage.growth+'%'}</div><div class="k">Member growth</div></div>
          <div class="stat"><div class="v">${c.usage.admins==null?'—':c.usage.admins}</div><div class="k">Active admins</div></div>
        </div>${useFlag}${drill("usage","View activity feed")}</div>
      <div class="panel">
        <h3>Finance &amp; Renewals <span class="wt">weight: lowest</span></h3>
        <p class="cap">Contract value, open invoices, renewal timing.</p>
        <div class="stat-row">
          <div class="stat"><div class="v">${c.nocontract?'—':money(c.acv)}</div><div class="k">ACV</div></div>
          <div class="stat"><div class="v">${money(c.ar)}</div><div class="k">Open AR</div></div>
          <div class="stat"><div class="v">${c.overdue}d</div><div class="k">Max overdue</div></div>
          <div class="stat"><div class="v">${c.renew==null?'—':c.renew+'d'}</div><div class="k">To renewal</div></div>
        </div>${finFlag}${drill("finance","View invoices")}</div>
      <div class="panel">
        <h3>Support &amp; Stability <span class="wt">weight: 3rd</span></h3>
        <p class="cap">Open issues, severity, recurring problems.</p>
        <div class="stat-row">
          <div class="stat"><div class="v">${c.sup.open}</div><div class="k">Open issues</div></div>
          <div class="stat"><div class="v" style="text-transform:capitalize">${c.sup.sev||'—'}</div><div class="k">Top severity</div></div>
          <div class="stat"><div class="v">${c.sup.recur?'Yes':'No'}</div><div class="k">Recurring</div></div>
          <div class="stat"><div class="v">${c.sup.since==null?'—':c.sup.since+'d'}</div><div class="k">Since last</div></div>
        </div>${supFlag}${drill("support","View support tickets")}</div>
      <div class="panel">
        <h3>Stakeholders &amp; Interactions <span class="wt">highest weight</span></h3>
        <p class="cap">Who we know, their level, coverage gaps, and our contact history (churn risk = relationship concentration).</p>
        <div class="stat-row grid2">
          <div class="stat"><div class="v">${c.stk.contacts}</div><div class="k">Known contacts</div></div>
          <div class="stat"><div class="v">${c.stk.eng}</div><div class="k">Engaged · 90d</div></div>
          <div class="stat"><div class="v">${c.intx.total}</div><div class="k">Interactions · all-time</div></div>
          <div class="stat"><div class="v">${c.intx.d90}</div><div class="k">Interactions · 90d</div></div>
        </div>${stkFlag}${intxFlag}
        <div class="drill" style="display:flex;gap:18px;flex-wrap:wrap">
          <button class="drill-btn" onclick="event.stopPropagation();openSub('${id}','stakeholders')">View contacts &amp; their interactions →</button>
          <button class="drill-btn" onclick="event.stopPropagation();openSub('${id}','interactions')">View all interactions →</button>
        </div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- sub-views ---------- */
const SUB={ support:{title:"Support Tickets",icon:"🛠️"}, interactions:{title:"Interactions",icon:"💬"}, finance:{title:"Invoices",icon:"🧾"}, stakeholders:{title:"Contacts & Stakeholders",icon:"👥"}, usage:{title:"Product Activity",icon:"📈"} };
const SORTS={
  support:[["updated","Recently updated"],["severity","Severity (high→low)"],["status","Open first"],["opened","Newest opened"],["requester","Requester A–Z"],["source","Source"]],
  interactions:[["recent","Most recent"],["oldest","Oldest first"],["type","Type"],["who","Who (A–Z)"]],
  finance:[["due","Due date"],["amount","Amount (high→low)"],["status","Overdue first"]],
  stakeholders:[["role","Admin level"],["name","Name A–Z"],["recent","Recently engaged"],["stale","Least recently engaged"],["activity","Most interactions"]],
  usage:[["recent","Most recent"],["type","Type"]]
};
const SORTDEF={support:"updated",interactions:"recent",finance:"due",stakeholders:"role",usage:"recent"};
function sortBar(id,sec,cur){ const opts=SORTS[sec].map(([k,l])=>`<option value="${k}" ${k===cur?'selected':''}>${l}</option>`).join(""); return `<div class="sortbar"><label>Sort by</label><select class="sortsel" onchange="openSub('${id}','${sec}',this.value)">${opts}</select></div>`; }
async function openSub(id,sec,sortKey){
  const c=C.find(x=>x.id===id); const meta=SUB[sec]; sortKey=sortKey||SORTDEF[sec];
  document.getElementById("view").innerHTML=`<div class="crumb"><button onclick="renderPortfolio()">Portfolio</button> <span class="sep">/</span> <button onclick="renderDetail('${id}')">${c.name}</button> <span class="sep">/</span> ${meta.title}</div><p class="page-sub">Loading ${meta.title.toLowerCase()}…</p>`;
  let d; try{ d=await loadDetails(c); }catch(e){ document.getElementById('view').innerHTML=`<div class="banner">Couldn’t load records: ${(e&&e.message)||e}</div>`; return; }
  let summary="", body="";
  if(sec==="support"){[summary,body]=viewSupport(c,d,sortKey);}
  else if(sec==="interactions"){[summary,body]=viewInter(c,d,sortKey);}
  else if(sec==="finance"){[summary,body]=viewFinance(c,d,sortKey);}
  else if(sec==="stakeholders"){[summary,body]=viewStake(c,d,sortKey);}
  else if(sec==="usage"){[summary,body]=viewUsage(c,d,sortKey);}
  document.getElementById("view").innerHTML=`
    <div class="crumb"><button onclick="renderPortfolio()">Portfolio</button> <span class="sep">/</span>
      <button onclick="renderDetail('${id}')">${c.name}</button> <span class="sep">/</span> ${meta.title}</div>
    <div class="sub-head">
      <div><h2><span>${meta.icon}</span> ${meta.title} <span class="subtle" style="font-weight:400;font-size:15px">· ${c.name}</span></h2>
        <div class="meta">Click any row to expand its full details.</div></div>
      <div class="sub-summary">${summary}</div>
    </div>
    ${sortBar(id,sec,sortKey)}
    <div class="reclist">${body||'<p class="page-sub">No records found.</p>'}</div>`;
  window.scrollTo(0,0);
}
function toggleRec(el){el.parentElement.classList.toggle("open");}
function showSource(ev,id,source,kind,url){
  ev.stopPropagation();
  const ov=document.createElement("div"); ov.className="srcmodal";
  ov.innerHTML=`<div class="card" onclick="event.stopPropagation()">
    <h4>Open in ${source}</h4>
    <p>This ${kind.toLowerCase()} lives in ${source}. The link below opens the original record.</p>
    <div class="u">${url}</div>
    <div class="mbtns"><button class="mbtn" onclick="this.closest('.srcmodal').remove()">Close</button>
      <a class="mbtn primary" href="${url}" target="_blank" rel="noopener">Open in ${source} ↗</a></div>
  </div>`;
  ov.onclick=()=>ov.remove(); document.body.appendChild(ov);
}
const st=(v,k)=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
const kv=(k,v)=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`;

function viewSupport(c,d,sortKey){
  const open=d.tickets.filter(t=>t.status==="Open"), res=d.tickets.filter(t=>t.status==="Resolved");
  const summary=st(open.length,"Open")+st(res.length,"Resolved")+st(c.sup.recur&&d.theme!=="None"?d.theme.split(" ")[0]+"…":"None","Recurring theme");
  const sev={high:0,med:1,low:2};
  const t=d.tickets.slice();
  if(sortKey==="severity") t.sort((a,b)=>sev[a.severity]-sev[b.severity]||a.updatedAgo-b.updatedAgo);
  else if(sortKey==="status") t.sort((a,b)=>(a.status==="Open"?0:1)-(b.status==="Open"?0:1)||sev[a.severity]-sev[b.severity]);
  else if(sortKey==="opened") t.sort((a,b)=>a.openedAgo-b.openedAgo);
  else if(sortKey==="requester") t.sort((a,b)=>a.requester.localeCompare(b.requester));
  else if(sortKey==="source") t.sort((a,b)=>a.source.localeCompare(b.source)||sev[a.severity]-sev[b.severity]);
  else t.sort((a,b)=>a.updatedAgo-b.updatedAgo);
  const rows=t.map(t=>{
    const sevCls=t.severity==="high"?"t-high":t.severity==="med"?"t-med":"t-low";
    const stCls=t.status==="Open"?"t-open":"t-resolved";
    const hasUrl=t.sourceUrl && /^https?:\/\//.test(t.sourceUrl);
    const link=hasUrl
      ? `<a class="srclink" href="${t.sourceUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View in ${t.source} ↗</a>`
      : `<span class="srclink off" title="No external link — logged directly from ${t.source}">Logged via ${t.source}</span>`;
    const thread=t.thread.map(ev=>`<div class="ev"><div class="h"><b>${ev.who}</b> · ${ago(ev.whenAgo)}</div><div class="txt">${ev.txt}</div></div>`).join("");
    return `<div class="rec"><div class="rec-top" onclick="toggleRec(this)">
        <div class="rec-ic">${t.severity==="high"?"🔴":t.severity==="med"?"🟡":"🔵"}</div>
        <div class="rec-main"><b>${t.subject}</b>
          <div class="sub"><span class="tag ${stCls}">${t.status}</span><span class="tag ${sevCls}">${cap1(t.severity)} severity</span><span class="tag t-neutral">${t.kind} · ${t.source}</span>${t.recurring?'<span class="tag t-neutral">Recurring</span>':''}<span>Requester: ${t.requester}</span></div></div>
        <div class="rec-right"><span class="when">Updated ${ago(t.updatedAgo)}</span>${link}</div>
        <span class="chev">▶</span></div>
      <div class="rec-body">
        <div class="kv">${kv("Status",t.status)}${kv("Severity",cap1(t.severity))}${kv("Type",t.kind)}${kv("Category",t.category)}${kv("Requester",t.requester)}${kv("Opened",t.opened)}${kv("Last update",t.updated)}${kv("Source",t.source)}</div>
        <div class="metaline">Activity</div>
        <div class="thread">${thread}</div>
      </div></div>`;}).join("");
  return [summary,rows];
}
function viewInter(c,d,sortKey){
  const summary=st(c.intx.total,"All-time")+st(c.intx.d90,"Last 90d")+st(ago(c.intx.since),"Last touch");
  const x=d.inter.slice();
  if(sortKey==="oldest") x.sort((a,b)=>b.when-a.when);
  else if(sortKey==="type") x.sort((a,b)=>a.type.localeCompare(b.type)||a.when-b.when);
  else if(sortKey==="who") x.sort((a,b)=>a.participants[0].name.localeCompare(b.participants[0].name)||a.when-b.when);
  else x.sort((a,b)=>a.when-b.when);
  const rows=x.map(x=>{
    const ic=x.type==="Call"?"📞":x.type==="Meeting"?"🗓️":"✉️";
    const who=x.participants.map(p=>p.name).join(", ");
    const whoDetail=x.participants.map(p=>`${p.name} <span class="subtle">— ${p.title}</span>`).join("<br>");
    return `<div class="rec"><div class="rec-top" onclick="toggleRec(this)">
        <div class="rec-ic">${ic}</div>
        <div class="rec-main"><b>${x.subj}</b>
          <div class="sub"><span class="tag t-neutral">${x.type}</span><span>${x.dir}</span><span><b>with ${who}</b></span></div></div>
        <div class="rec-right"><span class="when">${x.date}</span><span class="when">${ago(x.when)}</span></div>
        <span class="chev">▶</span></div>
      <div class="rec-body">
        <div class="kv">${kv("Type",x.type)}${kv("Source",x.owner)}${kv("Date",x.date+" ("+ago(x.when)+")")}${kv("Who it was with",whoDetail)}</div>
        <p class="desc">${x.notes}</p>
      </div></div>`;}).join("");
  return [summary,rows];
}
function viewFinance(c,d,sortKey){
  const openBal=d.inv.filter(i=>i.status!=="Paid").reduce((s,i)=>s+i.amount,0);
  const summary=st(c.nocontract?"—":money(c.acv),"ACV")+st(money(openBal),"Open balance")+st(c.overdue>0?c.overdue+"d":"—","Overdue");
  const so={Overdue:0,Open:1,Paid:2};
  const v=d.inv.slice();
  if(sortKey==="amount") v.sort((a,b)=>b.amount-a.amount);
  else if(sortKey==="status") v.sort((a,b)=>so[a.status]-so[b.status]||b.dueAgo-a.dueAgo);
  else v.sort((a,b)=>b.dueAgo-a.dueAgo);
  const rows=v.map(i=>{
    const cls=i.status==="Overdue"?"t-overdue":i.status==="Paid"?"t-paid":"t-open";
    const ic=i.status==="Paid"?"✅":i.status==="Overdue"?"⚠️":"🧾";
    return `<div class="rec"><div class="rec-top" onclick="toggleRec(this)">
        <div class="rec-ic">${ic}</div>
        <div class="rec-main"><b>${i.number} · ${money(i.amount)}</b>
          <div class="sub"><span class="tag ${cls}">${i.status}${i.status==="Overdue"?" · "+i.daysOverdue+"d":""}</span><span>${i.period}</span></div></div>
        <div class="rec-right"><span class="when">Due ${i.due}</span></div>
        <span class="chev">▶</span></div>
      <div class="rec-body">
        <div class="kv">${kv("Invoice",i.number)}${kv("Amount",money(i.amount))}${kv("Status",i.status)}${kv("Issued",i.issued)}${kv("Due",i.due)}${i.status==="Paid"?kv("Paid",i.paidDate):kv("Overdue by",i.daysOverdue>0?i.daysOverdue+" days":"—")}</div>
        ${i.status==="Overdue"?'<p class="desc" style="color:#a5342c">Payment is past due. Recommend clearing this balance before the renewal conversation.</p>':i.status==="Open"?'<p class="desc subtle">Invoice issued and within payment terms.</p>':'<p class="desc subtle">Paid in full — no action needed.</p>'}
      </div></div>`;}).join("");
  return [summary,rows];
}
function viewStake(c,d,sortKey){
  const admins=d.contacts.filter(x=>x.role==="Company Admin").length;
  const teamA=d.contacts.filter(x=>x.role==="Team Admin").length;
  const summary=st(d.contacts.length,"Known contacts")+st(admins,"Company Admins")+st(teamA,"Team Admins")+st(c.stk.gap?"Gap":"OK","Coverage");
  const gapNote=c.stk.gap?`<div class="rec" style="border-color:#f4d9b0;background:var(--accent-lt)"><div class="rec-top" style="cursor:default"><div class="rec-ic" style="background:#fff;color:var(--accent)">!</div><div class="rec-main"><b>No Company Admin (CPO/CDO/CEO) identified</b><div class="sub">Relationship is concentrated in Team Admins — multi-thread to reduce churn risk.</div></div></div></div>`:"";
  const ro={"Company Admin":0,"Team Admin":1,"Member":2,"IT":3};
  const p=d.contacts.slice();
  if(sortKey==="name") p.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sortKey==="recent") p.sort((a,b)=>a.last-b.last);
  else if(sortKey==="stale") p.sort((a,b)=>b.last-a.last);
  else if(sortKey==="activity") p.sort((a,b)=>b.interactions.length-a.interactions.length||a.last-b.last);
  else p.sort((a,b)=>((ro[a.role]??9)-(ro[b.role]??9))||a.last-b.last);
  const relCls=s=>s==="Engaged"?"t-paid":s==="Connected"?"t-low":"t-neutral";
  const rows=p.map(p=>{
    const rc=p.role==="Company Admin"?"t-paid":p.role==="Team Admin"?"t-low":"t-neutral";
    const ixs=p.interactions.slice().sort((a,b)=>a.when-b.when);
    const ixHtml = ixs.length
      ? `<div class="metaline">Interactions with ${p.name.split(" ")[0]} (${ixs.length})</div><div class="ixlist">`+
        ixs.map(ix=>`<div class="ixitem"><span class="ic">${ix.type==="Call"?"📞":ix.type==="Meeting"?"🗓️":"✉️"} ${ix.subj}</span><div class="d">${ix.date} · ${ago(ix.when)}${ix.participants.length>1?" · with "+ix.participants.map(q=>q.name).join(", "):""}</div></div>`).join("")+
        `</div>`
      : `<p class="desc subtle">No logged interactions with this person yet.</p>`;
    return `<div class="rec"><div class="rec-top" onclick="toggleRec(this)">
        <div class="rec-ic">${initials(p.name)}</div>
        <div class="rec-main"><b>${p.name}</b>
          <div class="sub"><span class="tag ${rc}">${p.role}</span><span class="tag ${relCls(p.relStatus)}">${p.relStatus}</span><span>${p.title}</span></div></div>
        <div class="rec-right"><span class="when">${ix_count_label(p)}</span><span class="when">Last touch ${p.lastIx!=null?ago(p.lastIx):"—"}</span></div>
        <span class="chev">▶</span></div>
      <div class="rec-body">
        <div class="kv">${kv("Name",p.name)}${kv("Role",p.role)}${kv("Title",p.title)}${kv("Email",p.email)}${kv("Relationship",p.relStatus)}${kv("Interactions",p.interactions.length)}${kv("Last touch",p.lastIx!=null?fmtD(dAgo(p.lastIx))+" ("+ago(p.lastIx)+")":"—")}</div>
        ${ixHtml}
      </div></div>`;}).join("");
  return [summary,gapNote+rows];
}
function ix_count_label(p){const n=p.interactions.length;return n+" interaction"+(n===1?"":"s");}
function viewUsage(c,d,sortKey){
  const summary=st(c.usage.ev,"Events · 30d")+st(c.usage.comms,"Comms · 30d")+st(c.usage.growth==null?"—":(c.usage.growth>0?'+':'')+c.usage.growth+"%","Member growth");
  const icon={Event:"📅",Comm:"📣",Members:"👥",Admin:"🛠️"};
  const a=d.acts.slice();
  if(sortKey==="type") a.sort((x,y)=>x.type.localeCompare(y.type)||x.when-y.when);
  else a.sort((x,y)=>x.when-y.when);
  const rows=a.map(a=>`
    <div class="rec"><div class="rec-top" onclick="toggleRec(this)">
        <div class="rec-ic">${icon[a.type]||"•"}</div>
        <div class="rec-main"><b>${a.title}</b>
          <div class="sub"><span class="tag t-neutral">${a.type}</span><span>${a.detail}</span></div></div>
        <div class="rec-right"><span class="when">${ago(a.when)}</span></div>
        <span class="chev">▶</span></div>
      <div class="rec-body">
        <div class="kv">${kv("Type",a.type)}${kv("When",fmtD(dAgo(a.when))+" ("+ago(a.when)+")")}</div>
      </div></div>`).join("");
  return [summary,rows];
}

boot();

</script>
</body>
</html>
